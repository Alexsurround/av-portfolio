<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Alexandr Fedorov — AV Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* Meyer Sound palette: #222 base + cobalt blue + amber gold */
  --gold:#f0a500;--gold-dim:#c47f00;--gold-light:#ffc233;
  --blue:#4d8fd4;--blue-dim:#2e6aaa;--blue-bright:#78b3f0;
  --bg:#222222;--bg2:#2c2c2c;--bg3:#333333;--bg4:#3d3d3d;
  --text:#f0f0f0;--text-dim:#a0a0a0;--text-muted:#606060;
  --border:#3a3a3a;--border-gold:rgba(240,165,0,0.3);--border-blue:rgba(77,143,212,0.35);
  --accent:var(--blue);--accent-dim:var(--blue-dim);
  --font-head:'Cormorant Garamond',serif;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'DM Mono',monospace;
}
html{scroll-behavior:smooth;font-size:18px}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-weight:300;line-height:1.6;overflow-x:hidden}
::selection{background:var(--blue);color:#fff}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--blue-dim)}

@media print{
  .no-print,.hero-bg,.nav-fixed{display:none!important}
  body{background:#fff;color:#000}
  .project-card{break-inside:avoid;border:1px solid #ccc;margin-bottom:20px;background:#fff}
  .project-card h2{color:#000}
  .equip-tag{background:#eee;color:#333;border-color:#999}
  .section-title{color:#000}
  .portfolio-grid{grid-template-columns:1fr 1fr}
  .hero{min-height:auto;padding:40px 20px}
  .hero h1{font-size:3rem;color:#000}
  .badge{background:#eee;color:#000;border-color:#999}
}

/* NAV */
.nav-fixed{position:fixed;top:0;left:0;right:0;z-index:100;padding:0;background:rgba(30,30,30,0.98);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-inner{display:flex;justify-content:space-between;align-items:center;padding:14px 40px}
.nav-top-bar{height:3px;background:linear-gradient(90deg,var(--blue) 0%,var(--blue-bright) 50%,var(--gold) 100%)}
.nav-logo{font-family:var(--font-head);font-size:1.4rem;letter-spacing:0.15em;color:var(--text);text-decoration:none}
.nav-logo span{color:var(--blue)}
.nav-links{display:flex;gap:32px;list-style:none}
.nav-links a{font-size:0.9rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-dim);text-decoration:none;transition:color 0.3s}
.nav-links a:hover{color:var(--blue)}
.nav-right{display:flex;align-items:center;gap:10px}
.lang-switcher{display:flex;gap:4px}
.lang-btn{background:none;border:1px solid var(--border);color:var(--text-muted);font-size:0.82rem;letter-spacing:0.1em;padding:7px 12px;cursor:pointer;font-family:var(--font-body);transition:all 0.3s}
.lang-btn.active{border-color:var(--blue-dim);color:var(--blue)}
.lang-btn:hover{border-color:var(--text-muted);color:var(--text-dim)}
.nav-pdf-btn{font-size:0.82rem;letter-spacing:0.1em;text-transform:uppercase;padding:8px 20px;border:1px solid var(--border);color:var(--text-dim);background:none;cursor:pointer;font-family:var(--font-body);transition:all 0.3s}
.nav-pdf-btn:hover{border-color:var(--blue);color:var(--blue)}

/* HERO */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:120px 20px 80px}
.hero-bg{position:absolute;inset:0;
  background-image:url('./media/hero-bg.jpg');
  background-size:cover;background-position:center;background-repeat:no-repeat}
.hero-bg::before{content:'';position:absolute;inset:0;background:rgba(25,25,25,0.80)}
.hero-bg::after{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 50% at 30% 60%,rgba(74,143,232,0.12) 0%,transparent 60%),
  radial-gradient(ellipse 50% 40% at 80% 30%,rgba(232,184,75,0.07) 0%,transparent 60%)}
.hero-content{position:relative;z-index:1;max-width:900px}
.hero-eyebrow{font-size:0.88rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--blue);margin-bottom:24px;opacity:0.9}
.hero h1{font-family:var(--font-head);font-size:clamp(4rem,9vw,8rem);font-weight:300;line-height:1.05;letter-spacing:0.02em;margin-bottom:8px}
.hero h1 em{font-style:italic;color:var(--blue)}
.hero-sub{font-size:1.15rem;color:var(--text-dim);letter-spacing:0.08em;margin-bottom:48px;font-weight:300}
.hero-badges{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:56px}
.badge{padding:9px 22px;border:1px solid var(--border-blue);font-size:0.82rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--blue-bright);background:rgba(74,143,232,0.06)}
.badge:nth-child(2n){border-color:var(--border-gold);color:var(--gold);background:rgba(232,184,75,0.05)}
.hero-divider{width:1px;height:60px;background:linear-gradient(to bottom,transparent,var(--blue),transparent);margin:0 auto;opacity:0.5}
.hero-stats{display:flex;gap:60px;justify-content:center;margin-top:48px}
.stat-num{font-family:var(--font-head);font-size:3.5rem;font-weight:300;color:var(--blue);line-height:1}
.stat-label{font-size:0.82rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-dim);margin-top:6px}

/* SECTION */
.section{padding:100px 40px;max-width:1400px;margin:0 auto}
.section-header{display:flex;align-items:center;gap:24px;margin-bottom:64px}
.section-num{font-family:var(--font-mono);font-size:0.72rem;color:var(--blue);opacity:0.7}
.section-title{font-family:var(--font-head);font-size:clamp(2rem,4vw,3.5rem);font-weight:300;letter-spacing:0.02em}
.section-line{flex:1;height:1px;background:linear-gradient(90deg,var(--border-blue),transparent)}

/* FILTERS */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:48px}
.filter-btn{padding:9px 22px;border:1px solid var(--border);font-size:0.85rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-dim);background:none;cursor:pointer;font-family:var(--font-body);transition:all 0.3s}
.filter-btn:hover,.filter-btn.active{border-color:var(--blue);color:var(--blue);background:rgba(74,143,232,0.07)}

/* GRID */
.portfolio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:2px}
.project-card{background:var(--bg2);cursor:pointer;transition:transform 0.4s cubic-bezier(0.25,1,0.5,1);overflow:hidden;position:relative}
.project-card:hover{transform:translateY(-4px);z-index:2}
.card-img{aspect-ratio:16/10;overflow:hidden;position:relative;background:var(--bg3)}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform 0.6s cubic-bezier(0.25,1,0.5,1);filter:brightness(0.8) saturate(0.9)}
.project-card:hover .card-img img{transform:scale(1.04);filter:brightness(0.9) saturate(1)}
.card-img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3rem;opacity:0.3}
.card-badge{position:absolute;top:16px;right:16px;padding:5px 14px;background:rgba(34,34,34,0.90);border:1px solid var(--blue-dim);font-size:0.75rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--blue-bright);backdrop-filter:blur(4px)}
.card-body{padding:28px 32px 32px}
.card-meta{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.card-year{font-family:var(--font-mono);font-size:0.85rem;color:var(--blue);opacity:0.8}
.card-loc{font-size:0.85rem;letter-spacing:0.08em;color:var(--text-dim);text-transform:uppercase}
.card-title{font-family:var(--font-head);font-size:1.9rem;font-weight:300;line-height:1.2;margin-bottom:12px;letter-spacing:0.01em}
.card-desc{font-size:1rem;color:var(--text-dim);line-height:1.65;margin-bottom:20px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-brands{display:flex;flex-wrap:wrap;gap:6px}
.brand-tag{font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;padding:5px 12px;border:1px solid var(--border);color:var(--text-muted)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(10,10,10,0.93);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;backdrop-filter:blur(4px)}
.modal{background:var(--bg2);max-width:900px;width:100%;position:relative;animation:slideUp 0.4s cubic-bezier(0.25,1,0.5,1)}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-close{position:absolute;top:24px;right:24px;background:rgba(34,34,34,0.85);border:1px solid var(--border);color:var(--text-dim);cursor:pointer;font-size:1rem;z-index:10;padding:8px 14px;font-family:var(--font-body);letter-spacing:0.1em;transition:all 0.3s;backdrop-filter:blur(4px)}
.modal-close:hover{border-color:var(--blue);color:var(--blue)}
.modal-hero{aspect-ratio:16/7;overflow:hidden;position:relative;background:var(--bg3)}
.modal-hero img{width:100%;height:100%;object-fit:cover;filter:brightness(0.85)}
.modal-hero-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:5rem;opacity:0.2}
.modal-body{padding:48px}
.modal-eyebrow{display:flex;gap:20px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.modal-cat{font-size:0.78rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--blue);padding:4px 12px;border:1px solid var(--border-blue)}
.modal-year{font-family:var(--font-mono);font-size:0.85rem;color:var(--text-dim)}
.modal-loc{font-size:0.85rem;color:var(--text-dim);letter-spacing:0.08em;text-transform:uppercase}
.modal-title{font-family:var(--font-head);font-size:clamp(2.2rem,5vw,3.8rem);font-weight:300;line-height:1.1;margin-bottom:24px;letter-spacing:0.01em}
.modal-desc{font-size:1.05rem;color:var(--text-dim);line-height:1.8;margin-bottom:36px;border-left:2px solid var(--blue-dim);padding-left:24px}
.modal-section-label{font-size:0.82rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--blue);margin-bottom:16px;opacity:0.8}
.equip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:36px}
.equip-tag{font-size:0.88rem;letter-spacing:0.06em;padding:7px 16px;border:1px solid var(--border);color:var(--text-dim);background:var(--bg3);font-family:var(--font-mono)}
.equip-tag.highlight{border-color:var(--border-gold);color:var(--gold);background:rgba(232,184,75,0.05)}
.modal-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:36px}
.modal-photos img{width:100%;aspect-ratio:4/3;object-fit:cover;cursor:pointer;filter:brightness(0.85);transition:filter 0.3s}
.modal-photos img:hover{filter:brightness(1)}
.modal-links{display:flex;flex-wrap:wrap;gap:12px}
.press-link{display:flex;align-items:center;gap:8px;padding:10px 18px;border:1px solid var(--border);font-size:0.75rem;color:var(--text-dim);text-decoration:none;letter-spacing:0.06em;transition:all 0.3s}
.press-link:hover{border-color:var(--blue);color:var(--blue)}
.video-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;margin-bottom:36px}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-mono);font-size:0.8rem;color:var(--text-muted);letter-spacing:0.2em}

/* FOOTER */
.footer{border-top:1px solid var(--border);padding:48px 40px;text-align:center}
.footer-name{font-family:var(--font-head);font-size:1.4rem;color:var(--blue);margin-bottom:4px}
.footer-sub{font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted)}

@media(max-width:768px){
  .nav-fixed{padding:16px 20px}
  .nav-links{display:none}
  .section{padding:60px 20px}
  .portfolio-grid{grid-template-columns:1fr}
  .modal-body{padding:24px}
  .hero-stats{gap:32px}
}
</style>
</head>
<body>
<div id="root"><div class="loading">LOADING PORTFOLIO...</div></div>
<script type="text/babel">
const {useState,useEffect}=React;

const CATS=['Concert Hall','Theatre & Opera','Cinema & Dolby','Casino & Club','Hotel & Hospitality','Corporate & Q-SYS'];
const CAT_ICONS={'Concert Hall':'🎵','Theatre & Opera':'🎭','Cinema & Dolby':'🎬','Casino & Club':'🎰','Hotel & Hospitality':'🏨','Corporate & Q-SYS':'🏢'};
const KEY_BRANDS=['Meyer Sound','L-Acoustics','QSC','DiGiCo','Dolby','Clair','LabGruppen'];
const ALL_BRANDS=['Meyer Sound','L-Acoustics','QSC','DiGiCo','Allen Heath','Allen & Heath','LabGruppen','Clair Brothers','Dolby','Robe','Clay Paky','High End','d&b','Yamaha','Shure','DPA','Beyerdynamic'];

const T={
  en:{
    eye:'AV Systems Engineer · Portfolio',
    sub:'Q-SYS Level 2 · Meyer Sound · L-Acoustics · DiGiCo · Dolby Atmos',
    badges:['Q-SYS Certified L2','20+ Years Experience','Official Distributor UA','First Dolby Atmos CIS','First L-Acoustics K3 UA'],
    s1:'Projects Delivered',s2:'Years in AV',s3:'Countries',
    projects:'Selected Projects',contact:'Contact',
    all:'All',equip:'Installed Equipment',video:'Video',gallery:'Gallery',press:'Press & Publications',
    back:'← Back',
    phone:'Phone',email:'Email',loc:'Location',cert:'Certification',certVal:'Q-SYS Level 2 Certified',
    footer:'AV Systems Engineer · Q-SYS Level 2 · Praha, Czech Republic',
  },
  cs:{
    eye:'AV Systems Engineer · Portfolio',
    sub:'Q-SYS · Meyer Sound · L-Acoustics · DiGiCo · Dolby Atmos',
    badges:['Q-SYS Certifikát L2','20+ Let Zkušeností','Oficiální Distributor UA','První Dolby Atmos SNS','První L-Acoustics K3 UA'],
    s1:'Realizovaných Projektů',s2:'Let v AV',s3:'Zemí',
    projects:'Vybrané Projekty',contact:'Kontakt',
    all:'Vše',equip:'Instalované Vybavení',video:'Video',gallery:'Galerie',press:'Tisk & Publikace',
    back:'← Zpět',
    phone:'Telefon',email:'E-mail',loc:'Místo',cert:'Certifikace',certVal:'Q-SYS Level 2 Certifikát',
    footer:'AV Systems Engineer · Q-SYS Level 2 · Praha, Česká republika',
  }
};

function getYTId(url){
  if(!url)return null;
  const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([^?&"'>]+)/);
  return m?m[1]:null;
}
function extractBrands(eq){
  const s=new Set();
  eq.forEach(e=>ALL_BRANDS.forEach(b=>{if(e.includes(b))s.add(b);}));
  return[...s].slice(0,5);
}
function getLang(p,field,lang){
  const v=p[`${field}_${lang}`];
  return(v&&v.trim())?v:p[field]||'';
}

function ProjectModal({project,onClose,t,lang}){
  const ytId=getYTId(project.videoUrl);
  const mainPhoto=project.photos&&project.photos[0];
  const desc=getLang(project,'description',lang);
  // Close on Escape
  useEffect(()=>{
    const h=e=>{if(e.key==='Escape')onClose();};
    window.addEventListener('keydown',h);
    return()=>window.removeEventListener('keydown',h);
  },[]);
  return(
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal">
        <button className="modal-close" onClick={onClose}>{t.back}</button>
        <div className="modal-hero">
          {mainPhoto
            ?<img src={mainPhoto} alt={project.title} onError={e=>e.target.style.display='none'}/>
            :<div className="modal-hero-placeholder">{CAT_ICONS[project.category]||'🎵'}</div>}
        </div>
        <div className="modal-body">
          <div className="modal-eyebrow">
            <span className="modal-cat">{project.category}</span>
            <span className="modal-year">{project.year}</span>
            <span className="modal-loc">📍 {project.location}</span>
          </div>
          <h2 className="modal-title">{project.title}</h2>
          {desc&&<p className="modal-desc">{desc}</p>}

          {project.equipment&&project.equipment.length>0&&(
            <div>
              <div className="modal-section-label">{t.equip}</div>
              <div className="equip-grid">
                {project.equipment.map((e,i)=>(
                  <span key={i} className={`equip-tag${KEY_BRANDS.some(b=>e.includes(b))?' highlight':''}`}>{e}</span>
                ))}
              </div>
            </div>
          )}

          {ytId&&(
            <div>
              <div className="modal-section-label">{t.video}</div>
              <div className="video-wrap">
                <iframe src={`https://www.youtube.com/embed/${ytId}`} allowFullScreen title="video"/>
              </div>
            </div>
          )}

          {project.photos&&project.photos.length>1&&(
            <div>
              <div className="modal-section-label">{t.gallery}</div>
              <div className="modal-photos">
                {project.photos.slice(1).map((p,i)=>(
                  <img key={i} src={p} alt={`photo ${i+2}`}
                    onError={e=>e.target.style.display='none'}
                    onClick={()=>window.open(p,'_blank')}/>
                ))}
              </div>
            </div>
          )}

          {project.pressLinks&&project.pressLinks.length>0&&(
            <div>
              <div className="modal-section-label">{t.press}</div>
              <div className="modal-links">
                {project.pressLinks.map((l,i)=>(
                  <a key={i} href={l.url} target="_blank" rel="noreferrer" className="press-link">🔗 {l.label}</a>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function App(){
  const[projects,setProjects]=useState([]);
  const[loading,setLoading]=useState(true);
  const[filter,setFilter]=useState('All');
  const[selected,setSelected]=useState(null);
  const[lang,setLang]=useState('en');
  const t=T[lang];

  // Load projects.json — the single source of truth
  useEffect(()=>{
    fetch('./projects.json?v='+Date.now())
      .then(r=>r.json())
      .then(data=>{setProjects(data);setLoading(false);})
      .catch(()=>{setLoading(false);});
  },[]);

  const cats=[t.all,...CATS];
  const filtered=filter===t.all||filter==='All'
    ?projects
    :projects.filter(p=>p.category===filter);

  if(loading)return<div className="loading">LOADING...</div>;

  return(<>
    {/* NAV */}
    <nav className="nav-fixed no-print">
      <div className="nav-top-bar"/>
      <div className="nav-inner">
        <a className="nav-logo" href="#">A·F·<span>AV</span></a>
        <ul className="nav-links">
          <li><a href="#projects">{t.projects}</a></li>
          <li><a href="#contact">{t.contact}</a></li>
        </ul>
        <div className="nav-right">
          <div className="lang-switcher">
            <button className={`lang-btn${lang==='en'?' active':''}`} onClick={()=>setLang('en')}>EN</button>
            <button className={`lang-btn${lang==='cs'?' active':''}`} onClick={()=>setLang('cs')}>CS</button>
          </div>
          <button className="nav-pdf-btn" onClick={()=>window.print()}>⬇ PDF</button>
        </div>
      </div>
    </nav>

    {/* HERO */}
    <section className="hero" id="top">
      <div className="hero-bg"/>
      <div className="hero-content">
        <div className="hero-eyebrow">{t.eye}</div>
        <h1>Alexandr<br/><em>Fedorov</em></h1>
        <div className="hero-sub">{t.sub}</div>
        <div className="hero-badges">
          {t.badges.map((b,i)=><span key={i} className="badge">{b}</span>)}
        </div>
        <div className="hero-divider"/>
        <div className="hero-stats">
          <div className="stat"><div className="stat-num">100+</div><div className="stat-label">{t.s1}</div></div>
          <div className="stat"><div className="stat-num">20</div><div className="stat-label">{t.s2}</div></div>
          <div className="stat"><div className="stat-num">5</div><div className="stat-label">{t.s3}</div></div>
        </div>
      </div>
    </section>

    {/* PROJECTS */}
    <section className="section" id="projects">
      <div className="section-header">
        <span className="section-num">01</span>
        <h2 className="section-title">{t.projects}</h2>
        <div className="section-line"/>
      </div>
      <div className="filters no-print">
        {cats.map(c=>(
          <button key={c} className={`filter-btn${filter===c?' active':''}`} onClick={()=>setFilter(c)}>{c}</button>
        ))}
      </div>
      <div className="portfolio-grid">
        {filtered.map(p=>{
          const brands=extractBrands(p.equipment||[]);
          const mainPhoto=p.photos&&p.photos[0];
          return(
            <div key={p.id} className="project-card" onClick={()=>setSelected(p)}>
              <div className="card-img">
                {mainPhoto
                  ?<img src={mainPhoto} alt={p.title} onError={e=>e.target.style.display='none'} loading="lazy"/>
                  :<div className="card-img-placeholder">{CAT_ICONS[p.category]||'🎵'}</div>}
                <span className="card-badge">{p.category}</span>
              </div>
              <div className="card-body">
                <div className="card-meta">
                  <span className="card-year">{p.year}</span>
                  <span className="card-loc">📍 {p.location}</span>
                </div>
                <h2 className="card-title">{p.title}</h2>
                {p.description&&<p className="card-desc">{getLang(p,'description',lang)}</p>}
                <div className="card-brands">{brands.map((b,i)=><span key={i} className="brand-tag">{b}</span>)}</div>
              </div>
            </div>
          );
        })}
      </div>
    </section>

    {/* CONTACT */}
    <section className="section" id="contact">
      <div className="section-header">
        <span className="section-num">02</span>
        <h2 className="section-title">{t.contact}</h2>
        <div className="section-line"/>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))',gap:'2px'}}>
        {[
          ['📞',t.phone,'+420 721 989 448'],
          ['✉',t.email,'o.fedorov@seznam.cz'],
          ['📍',t.loc,'Praha / Liberec, CZ'],
          ['🏆',t.cert,t.certVal]
        ].map(([icon,label,val])=>(
          <div key={label} style={{background:'var(--bg2)',padding:'32px'}}>
            <div style={{fontSize:'1.5rem',marginBottom:'8px'}}>{icon}</div>
            <div style={{fontSize:'0.68rem',letterSpacing:'0.15em',textTransform:'uppercase',color:'var(--blue)',marginBottom:'6px'}}>{label}</div>
            <div style={{fontSize:'0.9rem',color:'var(--text-dim)'}}>{val}</div>
          </div>
        ))}
      </div>
    </section>

    {/* FOOTER */}
    <footer className="footer">
      <div className="footer-name">Alexandr Fedorov</div>
      <div className="footer-sub">{t.footer}</div>
    </footer>

    {/* MODAL */}
    {selected&&<ProjectModal project={selected} onClose={()=>setSelected(null)} t={t} lang={lang}/>}
  </>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
